<ui-dialog-layout [title]="text.title(quote()?.number ?? 0)">
  <form class="dialog-form" novalidate (submit)="submit($event)">
    @if (error(); as message) {
      <p class="alert" role="alert" data-testid="quote-dialog-error">{{ message }}</p>
    }
    <fieldset class="choices">
      <legend>{{ text.channel }}</legend>
      @for (item of channels(); track item.channel) {
        <label class="choice">
          <input
            type="radio"
            name="channel"
            [value]="item.channel"
            [checked]="channel() === item.channel"
            [disabled]="!item.allowed"
            (change)="select(item.channel)"
          />
          <span>
            <strong>{{ channelText[item.channel] }}</strong>
            @if (!item.allowed) {
              <small>{{ text.noConsent }}</small>
            }
          </span>
        </label>
      }
    </fieldset>
    <div class="row">
      <p class="hint" data-testid="send-recipient">
        <strong>{{ text.to }}:</strong> {{ recipient() }}
      </p>
      <ui-field [label]="text.expiration">
        <select uiControl (change)="setExpiration($event)">
          @for (days of expirationDays(); track days) {
            <option [value]="days" [selected]="days === expiresInDays()">
              {{ text.days(days) }}
            </option>
          }
        </select>
      </ui-field>
    </div>
    <ui-ai-badge />
    <ui-field [label]="text.message" [required]="true" [hint]="text.aiHint">
      <textarea
        uiControl
        rows="6"
        maxlength="1000"
        [value]="message()"
        [attr.aria-busy]="loadingMessage() || null"
        (input)="setMessage($event)"
      ></textarea>
    </ui-field>
    <div class="footer">
      <button uiButton type="button" (click)="ref.close(false)">{{ text.cancel }}</button>
      <button
        uiButton
        variant="primary"
        type="submit"
        [loading]="sending()"
        [disabled]="loadingMessage()"
      >
        {{ text.submit }}
      </button>
    </div>
  </form>
</ui-dialog-layout>
