<ui-dialog-layout [title]="text.title">
  <form class="dialog-form" novalidate (submit)="submit($event)">
    <p class="hint">{{ text.description }}</p>
    @if (error(); as message) {
      <p class="alert" role="alert" data-testid="quote-dialog-error">{{ message }}</p>
    }
    @if (loading()) {
      <ui-skeleton height="120px" />
    } @else if (orders().length === 0) {
      <p class="notice">{{ text.empty }}</p>
    } @else {
      <fieldset class="choices">
        <legend>{{ text.orders }}</legend>
        @for (order of orders(); track order.id) {
          <label class="choice">
            <input
              type="radio"
              name="serviceOrder"
              [value]="order.id"
              [checked]="selected() === order.id"
              (change)="selected.set(order.id)"
            />
            <span>
              <strong>{{ text.order(order.number) }} · {{ order.customerName }}</strong>
              <small>{{ order.plate }} · {{ order.vehicle }}</small>
            </span>
          </label>
        }
      </fieldset>
    }
    <div class="footer">
      <button uiButton type="button" (click)="ref.close()">{{ text.cancel }}</button>
      <button
        uiButton
        variant="primary"
        type="submit"
        [loading]="saving()"
        [disabled]="orders().length === 0"
      >
        {{ text.submit }}
      </button>
    </div>
  </form>
</ui-dialog-layout>
