<label class="label" [attr.for]="controlId">
  {{ label() }}
  @if (required()) {
    <span class="required" aria-hidden="true">*</span>
  }
</label>
<ng-content />
@if (error(); as message) {
  <p class="message message--error" [id]="errorId">{{ message }}</p>
} @else if (hint(); as message) {
  <p class="message" [id]="hintId">{{ message }}</p>
}
