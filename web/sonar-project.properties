# Análise do frontend no SonarQube local (rodada por scripts/sonar/run-analysis.mjs).
sonar.projectKey=mecanicaos-web
sonar.projectName=mecanicaOS · Web
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,src/testing/**
sonar.exclusions=**/*.spec.ts,src/testing/**,src/app/core/api/generated/**
sonar.coverage.exclusions=src/testing/**,src/*.ts,src/app/dev/dev.routes.production.ts,src/app/mocks/browser/**
sonar.cpd.exclusions=src/testing/**
sonar.javascript.lcov.reportPaths=coverage/oficina-web/lcov.sonar.info
sonar.scm.disabled=true
# Os campos recebem o rótulo pelo componente ui-field (label for + id gerado), que a regra estática
# não enxerga. A associação é conferida pelo axe nos testes de componente e no E2E.
sonar.issue.ignore.multicriteria=labels
sonar.issue.ignore.multicriteria.labels.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.labels.resourceKey=src/app/**/*.html
sonar.sourceEncoding=UTF-8
